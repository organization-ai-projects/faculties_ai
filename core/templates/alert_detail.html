<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détail de l'alerte</title>
  </head>
  <body>
    <h1>Détails de l'alerte #{{ alert.alert_id }}</h1>
    <p><strong>Professeur:</strong> {{ alert.teacher }}</p>
    <p><strong>Réponses incohérentes:</strong> {{ alert.responses }}</p>
    <p><strong>Statut:</strong> {{ alert.status }}</p>

    <form action="/resolve_alert/{{ alert.alert_id }}" method="POST">
      <button type="submit">Résoudre l'alerte</button>
    </form>

    <a href="/">Retour au tableau de bord</a>
  </body>
</html>
