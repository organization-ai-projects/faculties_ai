<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .alert {
        border: 1px solid #ddd;
        padding: 10px;
        margin: 10px 0;
      }
      .resolved {
        background-color: #dff0d8;
      }
      .pending {
        background-color: #f2dede;
      }
    </style>
  </head>
  <body>
    <h1>Alert Dashboard</h1>
    {% for alert in alerts %}
    <div
      class="alert {{ 'resolved' if alert.status == 'resolved' else 'pending' }}"
    >
      <h3>{{ alert.teacher }} - Alerte #{{ alert.alert_id }}</h3>
      <p><strong>Réponses incohérentes:</strong> {{ alert.responses }}</p>
      <p><strong>Statut:</strong> {{ alert.status }}</p>
      <a href="/alert/{{ alert.alert_id }}">Voir les détails</a>
      {% if alert.status != 'resolved' %}
      <form action="/resolve_alert/{{ alert.alert_id }}" method="POST">
        <button type="submit">Résoudre l'alerte</button>
      </form>
      {% endif %}
    </div>
    {% endfor %}
  </body>
</html>
